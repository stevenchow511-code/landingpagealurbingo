// COUNTDOWN
var time = 3600;

function updateTimer(){

    var hours = Math.floor(time / 3600);
    var minutes = Math.floor((time % 3600) / 60);
    var seconds = time % 60;

    document.getElementById("countdown").innerHTML =
        hours + " : " + minutes + " : " + seconds;

    if(time > 0){
        time--;
    }else{
        document.getElementById("countdown").innerHTML =
            "WAKTU HABIS!";
    clearInterval(timer);
    }

}
